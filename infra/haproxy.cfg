global
  log stdout format raw local0
  maxconn 8192
  ssl-default-bind-options ssl-min-ver TLSv1.2
  ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout tunnel 1h

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

frontend cleartext
  bind :80
  http-request redirect scheme https code 308

frontend tls
  bind :443 ssl crt /run/certs/vynl.pem alpn h2,http/1.1
  http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
  acl websocket hdr(Upgrade) -i WebSocket
  acl playlist_path path_beg /v1/playlists /v1/internal /v1/drafts /ws
  acl wrap_path path_beg /v1/wrap
  acl platform_path path_beg /v1/auth /v1/activity /v1/users/me
  use_backend playlist if playlist_path
  use_backend wrap if wrap_path
  use_backend platform if platform_path
  default_backend web

backend playlist
  option httpchk GET /readyz
  http-check expect status 200
  server-template playlist 2 playlist-service:8000 check inter 2s fall 2 rise 1 resolvers docker init-addr none

backend wrap
  option httpchk GET /readyz
  http-check expect status 200
  server-template wrap 2 wrap-service:8002 check inter 2s fall 2 rise 1 resolvers docker init-addr none

backend platform
  option httpchk GET /readyz
  http-check expect status 200
  server platform-stub platform-stub:8010 check inter 2s fall 2 rise 1

backend web
  server web web:80 check
