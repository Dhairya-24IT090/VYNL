global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: playlist
    metrics_path: /metrics
    static_configs:
      - targets: ["playlist-service:8000"]
  - job_name: wrap
    metrics_path: /metrics
    static_configs:
      - targets: ["wrap-service:8002"]
